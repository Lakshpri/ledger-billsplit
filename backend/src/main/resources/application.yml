server:
  port: ${PORT:8765}

spring:
  application:
    name: splitter

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billsplit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:notebook-bill-splitter-super-secret-key-change-me-in-prod-1234567890}
    expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:4200}

logging:
  level:
    com.notebook.splitter: DEBUG